<div class="glass-panel todo-container">
    <div class="todo-header">
        <h1 class="todo-title">Task List</h1>
        <p class="todo-subtitle">Stay productive today</p>
    </div>
    <div class="todo-form">
        <input type="text" #todoInput placeholder="What's next on the agenda?" autocomplete="off" (keydown.enter)="addTodo(todoInput)" />
        <button (click)="addTodo(todoInput)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </div>
    
    <ul class="todo-list">
        <!-- List empty -->
        <li class="todo-empty" *ngIf="todos().length === 0">Aucune tâche pour l'instant.</li>
        
        <!-- Items -->
        <li class="todo-item" *ngFor="let todo of todos()" [class.todo-item--done]="todo.todo">
            <button class="todo-check-btn" [class.checked]="todo.todo" (click)="toggleTodo(todo.id)">
                <svg *ngIf="todo.todo" class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>
            <span class="todo-text">{{ todo.title }}</span>
            <button class="todo-delete-btn" (click)="deleteTodo(todo.id)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </li>
    </ul>
</div>
